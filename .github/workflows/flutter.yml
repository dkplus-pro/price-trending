name: Flutter

on:
  push:
    paths: [apps/mobile/**]
  pull_request:
    paths: [apps/mobile/**]

permissions:
  contents: read

jobs:
  mobile:
    name: Analyze and test mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-lcov
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: warn
