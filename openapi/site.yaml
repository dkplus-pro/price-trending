openapi: 3.0.3
info:
  title: CMS Site API
  version: 0.1.0
  description: |
    对外站点公开 API(只读、无鉴权)。路径一律带 /api/site 前缀,公网网关按此放行。
    响应与 admin 同约定:`{code, message, data, logID}`(logID 为请求日志关联 ID,
    同时回传在 `X-Log-Id` 响应头,可经 `X-Request-Id` 请求头透传);错误响应为
    `{code, message, logID}`,用 HTTP 状态码 + message 表达。
    响应 schema 只描述 data 载荷(信封由服务端统一包装)。
    约定:只提供 GET;DTO 按对外需要裁剪(不原样暴露 admin 模型);媒体字段直接给 CDN 直链。
tags:
  - name: site
paths:
  /api/site/site-info:
    get:
      operationId: getSiteInfo
      summary: 站点公开信息(站名、Logo 等,来自 admin 系统配置)
      tags:
        - site
      responses:
        "200":
          description: 站点公开信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteInfo"
components:
  schemas:
    SiteInfo:
      type: object
      required:
        - siteName
        - logoUrl
      properties:
        siteName:
          type: string
        logoUrl:
          type: string
          description: Logo 图片地址(CDN 直链或空串)
