openapi: 3.0.3
info:
  title: CMS Site API
  version: 0.1.0
  description: |
    对外站点公开 API(只读、无鉴权)。路径一律带 /api/site 前缀,公网网关按此放行。
    响应与 admin 同约定:`{code, message, data, logID}`(logID 为请求日志关联 ID,
    同时回传在 `X-Log-Id` 响应头,可经 `X-Request-Id` 请求头透传);错误响应为
    `{code, message, logID}`,用 HTTP 状态码 + message 表达。
    响应 schema 只描述 data 载荷(信封由服务端统一包装)。
    约定:只提供 GET;DTO 按对外需要裁剪(不原样暴露 admin 模型);媒体字段直接给 CDN 直链。
    行情端点(/api/site/market/*)由服务端转发东方财富行情接口(push2/push2his),
    上游响应体原样透传(data 结构随上游,不做结构化承诺),服务端带 TTL 缓存以收敛对上游的低频请求。
tags:
  - name: site
  - name: Market
paths:
  /api/site/site-info:
    get:
      operationId: getSiteInfo
      summary: 站点公开信息(站名、Logo 等,来自 admin 系统配置)
      tags:
        - site
      responses:
        "200":
          description: 站点公开信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteInfo"
  /api/site/market/quote:
    get:
      operationId: getMarketQuote
      summary: 行情快照批量查询(服务端转发东方财富行情接口,带缓存)
      tags:
        - Market
      parameters:
        - name: secids
          in: query
          required: true
          description: 证券代码列表,逗号分隔,市场号.代码(如 1.000001,118.AU9999)
          schema:
            type: string
            pattern: "^[0-9]{1,3}\\.[A-Za-z0-9]{1,16}(,[0-9]{1,3}\\.[A-Za-z0-9]{1,16})*$"
      responses:
        "200":
          description: 上游快照原始 JSON(data 载荷;服务端缓存 15s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketUpstreamPayload"
        "400":
          $ref: "#/components/responses/MarketInvalidParam"
        "502":
          $ref: "#/components/responses/MarketUpstreamUnavailable"
  /api/site/market/kline:
    get:
      operationId: getMarketKline
      summary: K 线查询(服务端转发东方财富行情接口,带缓存)
      tags:
        - Market
      parameters:
        - name: secid
          in: query
          required: true
          description: 证券代码,市场号.代码(如 1.000001、118.AU9999)
          schema:
            type: string
            pattern: "^[0-9]{1,3}\\.[A-Za-z0-9]{1,16}$"
        - name: klt
          in: query
          required: false
          description: K 线周期(101 日线/102 周线/103 月线,缺省 101)
          schema:
            type: integer
            enum: [101, 102, 103]
        - name: fqt
          in: query
          required: false
          description: 复权方式(0 不复权/1 前复权,缺省 1)
          schema:
            type: integer
            enum: [0, 1]
        - name: beg
          in: query
          required: false
          description: 开始日期 YYYYMMDD(缺省 19700101)
          schema:
            type: string
            pattern: "^[0-9]{8}$"
        - name: end
          in: query
          required: false
          description: 结束日期 YYYYMMDD(缺省 20991231)
          schema:
            type: string
            pattern: "^[0-9]{8}$"
        - name: lmt
          in: query
          required: false
          description: 返回条数上限(缺省 120)
          schema:
            type: integer
            minimum: 1
            maximum: 2000
      responses:
        "200":
          description: 上游 K 线原始 JSON(data 载荷;服务端缓存 60s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketUpstreamPayload"
        "400":
          $ref: "#/components/responses/MarketInvalidParam"
        "502":
          $ref: "#/components/responses/MarketUpstreamUnavailable"
  /api/site/market/trends:
    get:
      operationId: getMarketTrends
      summary: 分时/五日走势(服务端转发东方财富行情接口,带缓存)
      tags:
        - Market
      parameters:
        - name: secid
          in: query
          required: true
          description: 证券代码,市场号.代码(如 1.000001、118.AU9999)
          schema:
            type: string
            pattern: "^[0-9]{1,3}\\.[A-Za-z0-9]{1,16}$"
        - name: ndays
          in: query
          required: false
          description: 走势天数(1 分时/5 五日,缺省 1)
          schema:
            type: integer
            enum: [1, 5]
      responses:
        "200":
          description: 上游分时原始 JSON(data 载荷;服务端缓存 60s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketUpstreamPayload"
        "400":
          $ref: "#/components/responses/MarketInvalidParam"
        "502":
          $ref: "#/components/responses/MarketUpstreamUnavailable"
  /api/site/market/sge-daily:
    get:
      operationId: getMarketSgeDaily
      summary: 上金所日线查询(服务端转发上金所官网 Dailyhq 接口,带缓存)
      description: |
        转发上海黄金交易所官网日线接口(POST graph/Dailyhq),Au99.99 等黄金现货合约的权威精确源。
        仅日 K,无成交量/成交额;上游无日期过滤参数,返回上市以来全量(约 2300+ 条),由调用方截断。
        上游对错误 instid 也返回 200,但数据行数值全 0,服务端已判定全 0 为上游无效数据(转译 502)。
      tags:
        - Market
      parameters:
        - name: instid
          in: query
          required: true
          description:
            上金所合约代码(如 Au99.99)。pattern 保守限定 Au 前缀数字合约(Au99.99/Au99.95 等);
            上金所另有 Au(T+D)、Au100g 等命名风格,确有需要再放宽 pattern,避免透传任意串
          schema:
            type: string
            pattern: "^Au[0-9]{2}\\.[0-9]{2}$"
      responses:
        "200":
          description: 上金所 Dailyhq 原始 JSON(data 载荷;服务端缓存 5 分钟)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSgeUpstreamPayload"
        "400":
          $ref: "#/components/responses/MarketInvalidParam"
        "502":
          $ref: "#/components/responses/MarketUpstreamUnavailable"
components:
  responses:
    MarketInvalidParam:
      description: 行情查询参数非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MarketUpstreamUnavailable:
      description: 行情上游不可用(上游限流/失败,可稍后重试)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SiteInfo:
      type: object
      required:
        - siteName
        - logoUrl
      properties:
        siteName:
          type: string
        logoUrl:
          type: string
          description: Logo 图片地址(CDN 直链或空串)
    MarketUpstreamPayload:
      type: object
      description: 东方财富行情接口原始响应体,结构随上游(服务端原样透传,不做结构化承诺)
      additionalProperties: true
    MarketSgeUpstreamPayload:
      type: object
      description: 上金所官网 Dailyhq 原始响应体(如 {"time":[[日期,开,收,低,高],...]}),服务端原样透传,不做结构化承诺
      additionalProperties: true
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP 状态码
        message:
          type: string
          description: 错误描述
